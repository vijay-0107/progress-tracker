name: Verify learning workspace

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-fund
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
        env:
          VITE_BASE_PATH: /progress-tracker/
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npx firebase emulators:exec --project demo-progress-tracker --only auth,firestore "npm run test:e2e"
        env:
          E2E_EMULATORS: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-report
          path: |
            playwright-report
            test-results
